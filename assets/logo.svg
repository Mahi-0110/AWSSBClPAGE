<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 160" width="1560" height="320">
  <defs>
    <linearGradient id="awsGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>

    <linearGradient id="tileB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="100%" stop-color="#D8005F" />
    </linearGradient>
    <linearGradient id="tileI" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A2E014" />
      <stop offset="100%" stop-color="#76B800" />
    </linearGradient>
    <linearGradient id="tileT" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC800" />
      <stop offset="100%" stop-color="#E59400" />
    </linearGradient>
    <linearGradient id="tileS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00C2FF" />
      <stop offset="100%" stop-color="#0085FF" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Group 1: AWS Smile Logo & Builder Center Branding -->
  <g transform="translate(15, 18)">
    <!-- 'aws' lower-case official text -->
    <text x="15" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="68" fill="#FFFFFF" letter-spacing="-2">aws</text>
    
    <!-- AWS Signature Smile Arrow -->
    <path d="M 12 85 Q 75 122 145 92" fill="none" stroke="url(#awsGlow)" stroke-width="8" stroke-linecap="round" filter="url(#orangeGlow)" />
    <path d="M 145 92 L 130 84 L 140 102 Z" fill="#FF9900" filter="url(#orangeGlow)" />

    <!-- Vertical Divider Line -->
    <line x1="168" y1="18" x2="168" y2="108" stroke="rgba(255,255,255,0.22)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 'BUILDER CENTER' Typography -->
    <text x="188" y="48" font-family="'IBM Plex Mono', 'JetBrains Mono', 'Courier New', monospace" font-weight="800" font-size="26" fill="#FFFFFF" letter-spacing="2">BUILDER CENTER</text>
    
    <!-- 'STUDENT COMMUNITY' Larger & Bolder Prominent Typography -->
    <text x="188" y="86" font-family="'IBM Plex Mono', 'JetBrains Mono', 'Courier New', monospace" font-weight="800" font-size="21" fill="#59F3D5" letter-spacing="2" filter="url(#shadow)">STUDENT COMMUNITY</text>
  </g>

  <!-- Group 2: BITS VIZAG Colorful Emblem -->
  <g transform="translate(520, 22)">
    <!-- BITS 4 Tile Blocks -->
    <rect x="0" y="0" width="46" height="46" rx="10" fill="url(#tileB)" filter="url(#shadow)"/>
    <text x="23" y="33" font-family="Arial, sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" text-anchor="middle">B</text>

    <rect x="52" y="0" width="46" height="46" rx="10" fill="url(#tileI)" filter="url(#shadow)"/>
    <text x="75" y="33" font-family="Arial, sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" text-anchor="middle">I</text>

    <rect x="104" y="0" width="46" height="46" rx="10" fill="url(#tileT)" filter="url(#shadow)"/>
    <text x="127" y="33" font-family="Arial, sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" text-anchor="middle">T</text>

    <rect x="156" y="0" width="46" height="46" rx="10" fill="url(#tileS)" filter="url(#shadow)"/>
    <text x="179" y="33" font-family="Arial, sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" text-anchor="middle">S</text>

    <!-- VIZAG Typography -->
    <text x="101" y="84" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#76B800" text-anchor="middle" letter-spacing="3" filter="url(#shadow)">VIZAG</text>
    <text x="101" y="104" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="11" fill="#B38BFF" text-anchor="middle" letter-spacing="4">CHAPTER</text>
  </g>
</svg>
